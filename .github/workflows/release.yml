name: Prepare npm release artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:package
      - run: npm pack
      - name: Validate the exact release artifact
        run: npm run test:package -- "$(node -p 'const p=require("./package.json"); `${p.name}-${p.version}.tgz`')"
      - name: Record artifact checksum
        run: sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: |
            *.tgz
            SHA256SUMS
